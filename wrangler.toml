name = "lem-rodeo-youversion"
main = "workers/youversion-proxy.mjs"
compatibility_date = "2026-05-01"
workers_dev = false

routes = [{ pattern = "lem.rodeo/api/*", zone_name = "lem.rodeo" }]

[vars]
YVP_ALLOWED_BIBLE_IDS = "12,21,24,42,51,57,58,62,64,65,73,93,100,110,111,113,130,131,206,1207,1209,1588,1849,1932,2079,2163,2200,2351,2530,2660,2692,3034,3427,3447,sef-tanakh"
YVP_ALLOWED_LANGUAGES = "en,he,de,fr"
YVP_ALLOWED_ORIGINS = "https://lem.rodeo,http://localhost:8788,http://127.0.0.1:8788"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Popup-open log. Query in the Cloudflare dashboard:
#   SELECT timestamp, index1 AS citation, blob1 AS translation, blob3 AS image
#   FROM lem_rodeo_popup_opens ORDER BY timestamp DESC LIMIT 50
[[analytics_engine_datasets]]
binding = "POPUP_LOG"
dataset = "lem_rodeo_popup_opens"

# NTFY_TOPIC — Worker secret. POSTed to https://ntfy.sh/$NTFY_TOPIC on each
# popup open, push-notifying any subscribed device.
# Prod (interactive prompt):
#   RP_IGNORE_GLOBAL_LIBVIPS=1 npx --yes wrangler@latest secret put NTFY_TOPIC
# (a bare `npx wrangler ...` may resolve a different version on first run.)
# Local: add NTFY_TOPIC="..." to .dev.vars (long, unguessable string).
