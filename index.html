<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lem</title>
  <style>
    html {
      background: no-repeat center center fixed;
      -webkit-background-size: auto;
      -moz-background-size: auto;
      -o-background-size: auto;
      background-size: auto;
    }

    body {
      display: grid;
      grid-template-rows: 100vh;
      grid-template-columns: 100vw;
    }

    .box {
      justify-self: center;
      align-self: center;
      font-family: monospace;
      font-size: x-large;
      backdrop-filter: revert;
      filter: blur(0.5px);
      padding: 10px 0px;
      margin: 30px;
      background: white;
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script type="module">
    import { h, text, app } from "https://unpkg.com/hyperapp"

    const state = {
      quote: "",
      bgColor: "white",
      textColor: "black"
    }

    const QuoteBox = state => h("div", {
      id: "quoteBox",
      class: "box",
      style: {
        background: state.bgColor,
        color: state.textColor
      }
    }, text(state.quote))

    const SetQuote = quote => state => ({ ...state, quote: quote })
    const SetColors = colors => state => ({ ...state, ...colors })

    const dispatch = app({
      init: state,
      view: QuoteBox,
      node: document.getElementById("app")
    })

    function randomIntFromInterval(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min)
    }

    async function getRandomImageJson() {
      const width = randomIntFromInterval(250, 2800)
      const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=random&grnnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=${width}&format=json&origin=*`

      try {
        const response = await fetch(url)
        const data = await response.json()
        const pages = data.query.pages
        const imageUrl = Object.values(pages)[0].imageinfo[0].thumburl
        document.body.style.backgroundImage = `url(${imageUrl})`
      } catch (error) {
        console.error('Error fetching background:', error)
      }
    }

    async function getVerse() {
      try {
        const response = await fetch("https://labs.bible.org/api/?passage=random&type=json")
        const data = await response.json()
        dispatch(SetQuote(data[0].text))
      } catch (error) {
        console.error("Error fetching quote:", error)
        dispatch(SetQuote("That the triumphing of the wicked is short, and the joy of the hypocrite but for a moment?"))
      }
    }

    function setRandomColors() {
      const randomColor = () => Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0')
      const bgColor = `#${randomColor()}`
      const textColor = calculateContrastColor(bgColor)
      dispatch(SetColors({ bgColor, textColor }))
    }

    function calculateContrastColor(hexColor) {
      const rgb = parseInt(hexColor.slice(1), 16)
      const r = (rgb >> 16) & 0xff
      const g = (rgb >> 8) & 0xff
      const b = (rgb >> 0) & 0xff
      const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b
      return luma < 128 ? "#fff" : "#000"
    }

    getVerse()
    getRandomImageJson()
    setRandomColors()

    setInterval(getRandomImageJson, 10000)
    setInterval(setRandomColors, 10000);
  </script>
</body>

</html>
