<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lem</title>
  <style>
    html {
      background: no-repeat center center fixed;
      -webkit-background-size: auto;
      -moz-background-size: auto;
      -o-background-size: auto;
      background-size: auto;
    }

    body {
      display: grid;
      grid-template-rows: 100vh;
      grid-template-columns: 100vw;
      margin: 0;
    }

    .box {
      justify-self: center;
      align-self: center;
      box-sizing: border-box;
      max-width: calc(100vw - 60px);
      font-family: monospace;
      font-size: x-large;
      backdrop-filter: revert;
      filter: blur(0.5px);
      padding: 10px 0px;
      margin: 30px;
      background: white;
      overflow-wrap: anywhere;
    }

    .corner {
      position: fixed;
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
    }

    .corner-top {
      top: var(--corner-offset, 0);
    }

    .corner-bottom {
      bottom: var(--corner-offset, 0);
    }

    .corner-left {
      left: var(--corner-offset, 0);
    }

    .corner-right {
      right: var(--corner-offset, 0);
    }

    .info-hint {
      --info-hint-size: 60px;
      display: flex;
      border: 0;
      width: var(--info-hint-size);
      height: var(--info-hint-size);
      padding: 0;
      font: 14px monospace;
      background: transparent;
    }

    .corner-top.info-hint {
      align-items: flex-start;
    }

    .corner-bottom.info-hint {
      align-items: flex-end;
    }

    .corner-left.info-hint {
      justify-content: flex-start;
    }

    .corner-right.info-hint {
      justify-content: flex-end;
    }

    .info-hint-layer {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 7px;
      color: black;
      background: white;
      filter: blur(0.2px);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .info-hint:hover .info-hint-layer {
      opacity: 1;
    }

    .info-hint-text {
      white-space: nowrap;
    }

    .info-hint-icon {
      display: inline-grid;
      place-items: center;
      width: 17px;
      height: 17px;
      border: 1px solid currentColor;
      line-height: 1;
      box-shadow: 2px 2px 0 currentColor;
    }

    .pause-tick {
      --corner-offset: 3px;
      width: 12px;
      height: 12px;
      opacity: 0;
      pointer-events: none;
    }

    .pause-tick::before,
    .pause-tick::after {
      content: "";
      position: absolute;
      top: 0;
      width: 3px;
      height: 10px;
      background: black;
    }

    .pause-tick::before {
      left: 1px;
    }

    .pause-tick::after {
      right: 1px;
    }

    body.paused .pause-tick {
      opacity: 0.78;
    }

    .quote-nudge {
      animation: quote-nudge 160ms steps(2, end);
    }

    @keyframes quote-nudge {
      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px);
      }

      75% {
        transform: translateX(4px);
      }
    }

    .info-modal {
      box-sizing: border-box;
      width: min(560px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      border: 1px solid black;
      padding: 18px 20px 14px;
      overflow: auto;
      color: black;
      background: white;
      font: 15px monospace;
      filter: blur(0.15px);
    }

    .info-modal::backdrop {
      background: rgba(255, 255, 255, 0.24);
    }

    .info-modal-close {
      position: absolute;
      top: 7px;
      right: 8px;
      border: 1px solid black;
      padding: 0 5px 1px;
      color: black;
      background: white;
      font: 15px monospace;
      line-height: 1.2;
      cursor: pointer;
    }

    .info-modal-title {
      margin: 0 26px 14px 0;
      font-size: 18px;
      font-weight: normal;
    }

    .info-modal-row {
      display: grid;
      grid-template-columns: 80px minmax(0, 1fr);
      gap: 12px;
      margin: 8px 0;
    }

    .info-modal-label {
      opacity: 0.65;
    }

    .info-modal-details,
    .info-modal-row dd {
      margin: 0;
      min-width: 0;
    }

    .info-modal a {
      color: black;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    .key-map {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 18px;
      margin-top: 18px;
      padding: 0;
      list-style: none;
    }

    .key-callout {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
    }

    .info-modal kbd {
      flex: 0 0 auto;
      min-width: var(--kbd-min-width, 19px);
      border: 1px solid black;
      padding: var(--kbd-padding, 3px 6px);
      color: black;
      background: white;
      font: var(--kbd-font, 14px monospace);
      text-align: center;
      box-shadow: var(--kbd-shadow, 2px 2px 0 black);
    }

    .key-arrow {
      display: inline-block;
      flex: 0 0 auto;
      width: 18px;
      border-top: 1px solid black;
    }

    .info-modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 16px;
      font-size: 13px;
      opacity: 0.72;
    }

    .info-modal-footer kbd {
      --kbd-min-width: 18px;
      --kbd-padding: 1px 4px;
      --kbd-font: 12px monospace;
      --kbd-shadow: 1px 1px 0 black;
    }

    @media (prefers-reduced-motion: reduce) {
      .quote-nudge {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <div class="corner corner-top corner-left info-hint" aria-hidden="true"><span class="info-hint-layer"><span class="info-hint-text">здрасти. 4ukni</span><span class="info-hint-icon">?</span></span></div>
  <div class="corner corner-top corner-right info-hint" aria-hidden="true"><span class="info-hint-layer"><span class="info-hint-text">здрасти. 4ukni</span><span class="info-hint-icon">?</span></span></div>
  <div class="corner corner-bottom corner-left info-hint" aria-hidden="true"><span class="info-hint-layer"><span class="info-hint-text">здрасти. 4ukni</span><span class="info-hint-icon">?</span></span></div>
  <div class="corner corner-bottom corner-right info-hint" aria-hidden="true"><span class="info-hint-layer"><span class="info-hint-text">здрасти. 4ukni</span><span class="info-hint-icon">?</span></span></div>
  <span class="corner corner-top corner-left pause-tick" aria-hidden="true"></span>
  <span class="corner corner-top corner-right pause-tick" aria-hidden="true"></span>
  <span class="corner corner-bottom corner-left pause-tick" aria-hidden="true"></span>
  <span class="corner corner-bottom corner-right pause-tick" aria-hidden="true"></span>

  <dialog id="infoModal" class="info-modal" aria-labelledby="infoModalTitle">
    <button id="infoModalClose" class="info-modal-close" type="button" aria-label="Close">x</button>
    <h1 id="infoModalTitle" class="info-modal-title">eh?</h1>

    <dl class="info-modal-details">
      <div class="info-modal-row">
        <dt class="info-modal-label">bible</dt>
        <dd id="infoModalCitation">loading</dd>
      </div>

      <div class="info-modal-row">
        <dt class="info-modal-label">source</dt>
        <dd><a id="infoModalImageLink" href="#" target="_blank" rel="noopener noreferrer">loading</a></dd>
      </div>
    </dl>

    <ul class="key-map" aria-label="Keyboard controls">
      <li class="key-callout"><kbd>Space</kbd><span class="key-arrow"></span><span>pause / start again</span></li>
      <li class="key-callout"><kbd>D</kbd><span class="key-arrow"></span><span>download</span></li>
      <li class="key-callout"><kbd>[</kbd><kbd>]</kbd><span class="key-arrow"></span><span>previous / next background</span></li>
    </ul>

    <div class="info-modal-footer"><kbd>esc</kbd><span>to close</span></div>
  </dialog>

  <script type="module">
    import { h, app } from "https://unpkg.com/hyperapp"

    const state = {
      quote: "",
      citation: "",
      imagePageUrl: "",
      bgColor: "white",
      textColor: "black"
    }

    const AllowedQuoteTags = new Set(["B", "STRONG", "I", "EM", "BR"])

    function sanitizedQuoteTemplate(html) {
      const template = document.createElement("template")
      template.innerHTML = html || ""

      template.content.querySelectorAll("*").forEach(node => {
        if (AllowedQuoteTags.has(node.tagName)) {
          Array.from(node.attributes).forEach(attribute => node.removeAttribute(attribute.name))
        } else {
          node.replaceWith(document.createTextNode(node.textContent))
        }
      })

      return template
    }

    function sanitizedQuoteHtml(html) {
      return sanitizedQuoteTemplate(html).innerHTML
    }

    function quoteText(html) {
      return sanitizedQuoteTemplate(html).content.textContent || ""
    }

    const QuoteBox = state => h("div", {
      id: "quoteBox",
      class: "box",
      style: {
        background: state.bgColor,
        color: state.textColor
      },
      "data-citation": state.citation,
      "data-image-page-url": state.imagePageUrl,
      innerHTML: sanitizedQuoteHtml(state.quote)
    })

    const SetVerse = verse => state => ({
      ...state,
      quote: verse.text,
      citation: citationFor(verse)
    })
    const SetImagePageUrl = imagePageUrl => state => ({ ...state, imagePageUrl })
    const SetColors = colors => state => ({ ...state, ...colors })

    const dispatch = app({
      init: state,
      view: QuoteBox,
      node: document.getElementById("app")
    })

    const infoModal = document.getElementById("infoModal")
    const infoModalClose = document.getElementById("infoModalClose")
    const infoModalCitation = document.getElementById("infoModalCitation")
    const infoModalImageLink = document.getElementById("infoModalImageLink")

    const MaxBackgroundSize = 2800
    const MinBackgroundSize = 250
    const MaxDownloadScale = 1.5
    const DownloadPixelLimit = 3000000
    const MaxImageFetchAttempts = 5
    const Interval = 10000
    const PauseReason = {
      User: "user",
      Modal: "modal"
    }
    const pauseReasons = new Set()
    const backgroundTrail = {
      records: [],
      visibleIndex: -1,

      get newestIndex() {
        return this.records.length - 1
      },

      get followingLiveEdge() {
        return this.visibleIndex === this.newestIndex
      },

      appendLoaded(record) {
        const shouldFollow = this.followingLiveEdge
        this.records.push(record)

        if (shouldFollow && !autoAdvancePaused()) showBackground(this.newestIndex)
      },

      move(delta) {
        const nextIndex = this.visibleIndex + delta

        if (nextIndex < 0 || nextIndex > this.newestIndex) {
          nudgeQuote()
        } else {
          showBackground(nextIndex)
        }
      }
    }
    let currentBackground
    let currentCitation = ""
    let currentQuote = ""

    function randomIntFromInterval(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min)
    }

    function wikimediaImageUrl(width) {
      const params = new URLSearchParams({
        action: "query",
        generator: "random",
        grnnamespace: "6",
        prop: "imageinfo",
        iiprop: "url|mime|mediatype",
        iiurlwidth: width,
        format: "json",
        origin: "*"
      })

      return `https://commons.wikimedia.org/w/api.php?${params}`
    }

    const WikimediaImageUrl = wikimediaImageUrl(randomIntFromInterval(MinBackgroundSize, MaxBackgroundSize))

    function audioMediaPage(page) {
      const imageInfo = page.imageinfo?.[0]
      const title = page.title || imageInfo?.url || ""

      return imageInfo?.mediatype === "AUDIO" ||
        imageInfo?.mime?.startsWith("audio/") ||
        /\.(ogg|oga|opus|mp3|wav|flac|m4a|mid|midi)$/i.test(title)
    }

    function backgroundRecord(page) {
      const imageInfo = page.imageinfo[0]

      return {
        title: page.title.replace(/^File:/, ""),
        imageUrl: imageInfo.thumburl || imageInfo.url,
        pageUrl: imageInfo.descriptionurl || imageInfo.descriptionshorturl || "",
        image: null
      }
    }

    function preloadBackground(record) {
      const image = new Image()
      image.crossOrigin = "anonymous"

      image.onload = () => {
        record.image = image
        backgroundTrail.appendLoaded(record)
      }

      image.onerror = error => console.error("Error loading background:", error)
      image.src = record.imageUrl
    }

    function showBackground(index) {
      currentBackground = backgroundTrail.records[index]
      backgroundTrail.visibleIndex = index
      document.documentElement.style.backgroundImage = `url(${currentBackground.imageUrl})`
      document.documentElement.style.backgroundPosition = "center center"
      document.documentElement.style.backgroundSize = "auto"
      document.documentElement.style.backgroundRepeat = "no-repeat"
      dispatch(SetImagePageUrl(currentBackground.pageUrl))
      updateInfoModal()
    }

    function citationFor(verse) {
      return `${verse.bookname} ${verse.chapter}:${verse.verse}`
    }

    function showVerse(verse) {
      currentCitation = citationFor(verse)
      currentQuote = quoteText(verse.text)
      dispatch(SetVerse(verse))
      updateInfoModal()
    }

    async function randomWikimediaPage() {
      const response = await fetch(WikimediaImageUrl)
      const data = await response.json()

      return Object.values(data.query?.pages || {})[0]
    }

    async function queueRandomWikimediaBackground(attempt = 1) {
      try {
        const page = await randomWikimediaPage()

        if (!page?.imageinfo?.[0]) return

        if (audioMediaPage(page)) {
          if (!autoAdvancePaused() && attempt < MaxImageFetchAttempts) {
            return queueRandomWikimediaBackground(attempt + 1)
          }
          return
        }

        preloadBackground(backgroundRecord(page))
      } catch (error) {
        console.error('Error fetching background:', error)
      }
    }

    async function getVerse() {
      try {
        const response = await fetch("https://labs.bible.org/api/?passage=random&type=json")
        const data = await response.json()
        showVerse(data[0])
      } catch (error) {
        console.error("Error fetching quote:", error)
        showVerse({
          bookname: "Job",
          chapter: "20",
          verse: "5",
          text: "That the triumphing of the wicked is short, and the joy of the hypocrite but for a moment?"
        })
      }
    }

    function setRandomColors() {
      const randomColor = () => Math.floor(Math.random() * 16777215).toString(16).padStart(6, '0')
      const bgColor = `#${randomColor()}`
      const textColor = calculateContrastColor(bgColor)
      dispatch(SetColors({ bgColor, textColor }))
    }

    function calculateContrastColor(hexColor) {
      const rgb = parseInt(hexColor.slice(1), 16)
      const r = (rgb >> 16) & 0xff
      const g = (rgb >> 8) & 0xff
      const b = (rgb >> 0) & 0xff
      const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b
      return luma < 128 ? "#fff" : "#000"
    }

    function openInfoModal() {
      updateInfoModal()
      setPaused(PauseReason.Modal, true)
      if (!infoModal.open) infoModal.showModal()
    }

    function closeInfoModal() {
      if (infoModal.open) infoModal.close()
      setPaused(PauseReason.Modal, false)
      if (infoModal.contains(document.activeElement)) document.activeElement.blur()
    }

    function updateInfoModal() {
      infoModalCitation.textContent = currentCitation || "loading"

      if (currentBackground?.pageUrl) {
        infoModalImageLink.href = currentBackground.pageUrl
        infoModalImageLink.textContent = currentBackground.title || currentBackground.pageUrl
      } else {
        infoModalImageLink.removeAttribute("href")
        infoModalImageLink.textContent = "loading"
      }
    }

    function autoAdvancePaused() {
      return pauseReasons.size > 0
    }

    function setPaused(reason, active) {
      if (active) {
        pauseReasons.add(reason)
      } else {
        pauseReasons.delete(reason)
      }

      syncPausedIndicator()
    }

    function syncPausedIndicator() {
      document.body.classList.toggle("paused", autoAdvancePaused())
    }

    function toggleUserPause() {
      setPaused(PauseReason.User, !pauseReasons.has(PauseReason.User))
    }

    function nudgeQuote() {
      const quoteBox = document.getElementById("quoteBox")
      quoteBox.classList.remove("quote-nudge")
      void quoteBox.offsetWidth
      quoteBox.classList.add("quote-nudge")
    }

    function previousBackground() {
      backgroundTrail.move(-1)
    }

    function nextBackground() {
      backgroundTrail.move(1)
    }

    function canvasBackgroundColor() {
      const bodyColor = getComputedStyle(document.body).backgroundColor
      return bodyColor === "rgba(0, 0, 0, 0)" ? "white" : bodyColor
    }

    function wrapCanvasText(context, text, maxWidth) {
      const words = text.split(/\s+/)
      const lines = []
      let line = ""

      words.forEach(word => {
        const nextLine = line ? `${line} ${word}` : word
        if (context.measureText(nextLine).width <= maxWidth || !line) {
          line = nextLine
        } else {
          lines.push(line)
          line = word
        }
      })

      if (line) lines.push(line)
      return lines
    }

    function drawQuoteBox(context) {
      const quoteBox = document.getElementById("quoteBox")
      const rect = quoteBox.getBoundingClientRect()
      const style = getComputedStyle(quoteBox)
      const paddingLeft = parseFloat(style.paddingLeft)
      const paddingRight = parseFloat(style.paddingRight)
      const paddingTop = parseFloat(style.paddingTop)
      const fontSize = parseFloat(style.fontSize)
      const lineHeight = parseFloat(style.lineHeight) || fontSize * 1.2

      context.fillStyle = style.backgroundColor
      context.fillRect(rect.left, rect.top, rect.width, rect.height)
      context.fillStyle = style.color
      context.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`
      context.textBaseline = "top"

      wrapCanvasText(context, currentQuote, rect.width - paddingLeft - paddingRight).forEach((line, index) => {
        context.fillText(line, rect.left + paddingLeft, rect.top + paddingTop + index * lineHeight)
      })
    }

    function filenameWords(text, limit = 5) {
      return (text || "")
        .replace(/\.[^.]+$/, "")
        .match(/[\p{L}\p{N}]+/gu)
        ?.slice(0, limit)
        .join("-") || "image"
    }

    function filenamePart(text) {
      return filenameWords(text, 12)
        .replace(/[^\p{L}\p{N}-]+/gu, "-")
        .replace(/^-+|-+$/g, "") || "lem-rodeo"
    }

    function downloadFilename() {
      return `${filenamePart(currentCitation)}-${filenamePart(filenameWords(currentBackground?.title))}.png`
    }

    function downloadScale(width, height) {
      const preferredScale = Math.min(window.devicePixelRatio || 1, MaxDownloadScale)
      const boundedScale = Math.sqrt(DownloadPixelLimit / (width * height))

      return Math.max(1, Math.min(preferredScale, boundedScale))
    }

    function drawCenteredBackground(context, image, width, height) {
      context.drawImage(image, (width - image.naturalWidth) / 2, (height - image.naturalHeight) / 2)
    }

    function downloadFailed(error) {
      if (error) console.error("Could not export download image:", error)
      nudgeQuote()
    }

    function downloadBlob(blob) {
      if (!blob) {
        console.error("Could not create download image")
        nudgeQuote()
        return
      }

      const filename = downloadFilename()
      const file = typeof File === "function" ? new File([blob], filename, { type: blob.type || "image/png" }) : blob
      const url = URL.createObjectURL(file)
      const link = document.createElement("a")

      link.href = url
      link.download = filename
      link.style.display = "none"
      document.body.append(link)
      link.click()

      setTimeout(() => {
        link.remove()
        URL.revokeObjectURL(url)
      }, 30000)
    }

    function downloadCurrentView() {
      if (!currentBackground?.image) {
        nudgeQuote()
        return
      }

      const width = window.innerWidth
      const height = window.innerHeight
      const scale = downloadScale(width, height)
      const canvas = document.createElement("canvas")
      const image = currentBackground.image

      canvas.width = Math.round(width * scale)
      canvas.height = Math.round(height * scale)

      const context = canvas.getContext("2d")
      if (!context) return downloadFailed()

      context.scale(scale, scale)
      context.fillStyle = canvasBackgroundColor()
      context.fillRect(0, 0, width, height)
      drawCenteredBackground(context, image, width, height)
      drawQuoteBox(context)

      try {
        canvas.toBlob(downloadBlob, "image/png")
      } catch (error) {
        downloadFailed(error)
      }
    }

    function editableTarget(target) {
      return target.isContentEditable || ["INPUT", "TEXTAREA", "SELECT", "BUTTON", "A"].includes(target.tagName)
    }

    function handleKeydown(event) {
      if (event.key === "Escape" && infoModal.open) {
        event.preventDefault()
        closeInfoModal()
        return
      }

      if (infoModal.open || editableTarget(event.target)) return

      if (event.key === "?") {
        event.preventDefault()
        openInfoModal()
      } else if (event.code === "Space") {
        event.preventDefault()
        toggleUserPause()
      } else if (event.key.toLowerCase() === "d") {
        event.preventDefault()
        downloadCurrentView()
      } else if (event.key === "[") {
        event.preventDefault()
        previousBackground()
      } else if (event.key === "]") {
        event.preventDefault()
        nextBackground()
      }
    }

    infoModalClose.addEventListener("click", closeInfoModal)
    infoModal.addEventListener("cancel", event => {
      event.preventDefault()
      closeInfoModal()
    })
    document.addEventListener("keydown", handleKeydown)

    function everyRodeoCycle(action) {
      setInterval(() => {
        if (!autoAdvancePaused()) action()
      }, Interval)
    }

    getVerse()
    queueRandomWikimediaBackground()
    setRandomColors()

    everyRodeoCycle(queueRandomWikimediaBackground)
    everyRodeoCycle(setRandomColors);
  </script>
</body>

</html>
