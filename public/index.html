<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>lem</title>
  <style>
    :root {
      --paper: white;
      --ink: black;
      --mono: monospace;
    }

    html {
      background: no-repeat center center fixed;
      -webkit-background-size: auto;
      -moz-background-size: auto;
      -o-background-size: auto;
      background-size: auto;
    }

    body {
      display: grid;
      grid-template-rows: 100vh;
      grid-template-columns: 100vw;
      margin: 0;
    }

    .box {
      justify-self: center;
      align-self: center;
      box-sizing: border-box;
      max-width: calc(100vw - 60px);
      font-family: var(--mono);
      font-size: x-large;
      backdrop-filter: revert;
      filter: blur(0.5px);
      padding: 10px 0px;
      margin: 30px;
      overflow-wrap: anywhere;
      position: relative;
      z-index: 10;
    }

    #bgLayer {
      position: fixed;
      inset: 0;
      z-index: 5;
      background: no-repeat center center;
      background-size: auto;
      pointer-events: none;
    }

    #noiseOverlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 1;
      transition: opacity 500ms ease-out;
    }

    #noiseOverlay.dismissed {
      opacity: 0;
    }

    #noiseSvg {
      position: absolute;
      left: 0;
      top: -25%;
      width: 100%;
      height: 150%;
      mix-blend-mode: multiply;
      opacity: 0.5;
      animation: noiseDrift 2.6s linear infinite;
    }

    .scanBand {
      position: absolute;
      mix-blend-mode: multiply;
      pointer-events: none;
      will-change: transform;
    }

    @keyframes noiseDrift {
      0%   { transform: translate3d(0, 0, 0); }
      25%  { transform: translate3d(-2%, 3%, 0); }
      50%  { transform: translate3d(1.5%, -2%, 0); }
      75%  { transform: translate3d(-1%, 2.5%, 0); }
      100% { transform: translate3d(0, 0, 0); }
    }

    @keyframes sweepDown { 0% { transform: translate(var(--off-x, 0), -120%); } 100% { transform: translate(var(--off-x, 0), calc(100vh + 20vh)); } }
    @keyframes sweepUp   { 0% { transform: translate(var(--off-x, 0), calc(100vh + 20vh)); } 100% { transform: translate(var(--off-x, 0), -120%); } }
    @keyframes sweepRight { 0% { transform: translate(-120%, var(--off-y, 0)); } 100% { transform: translate(calc(100vw + 20vw), var(--off-y, 0)); } }
    @keyframes sweepLeft  { 0% { transform: translate(calc(100vw + 20vw), var(--off-y, 0)); } 100% { transform: translate(-120%, var(--off-y, 0)); } }
    @keyframes sweepDiagDown { 0% { transform: rotate(var(--rot, -18deg)) translate(-80vw, -30vh); } 100% { transform: rotate(var(--rot, -18deg)) translate(80vw, 30vh); } }
    @keyframes sweepDiagUp   { 0% { transform: rotate(var(--rot, 18deg))  translate(-80vw, 30vh); }  100% { transform: rotate(var(--rot, 18deg))  translate(80vw, -30vh); } }

    .box,
    .info-hint-layer,
    .info-modal,
    .info-modal-close,
    .info-modal kbd {
      color: var(--ink);
      background: var(--paper);
    }

    .info-modal,
    .info-modal-close,
    .info-modal kbd {
      border: 1px solid var(--ink);
    }

    .corner {
      position: fixed;
      top: auto;
      right: auto;
      bottom: auto;
      left: auto;
      z-index: 10;
    }

    .corner[data-y="top"] {
      top: var(--corner-offset, 0);
    }

    .corner[data-y="bottom"] {
      bottom: var(--corner-offset, 0);
    }

    .corner[data-x="left"] {
      left: var(--corner-offset, 0);
    }

    .corner[data-x="right"] {
      right: var(--corner-offset, 0);
    }

    .info-hint {
      --info-hint-size: 60px;
      display: flex;
      border: 0;
      width: var(--info-hint-size);
      height: var(--info-hint-size);
      padding: 0;
      font: 14px var(--mono);
      background: transparent;
    }

    .info-hint[data-y="top"] {
      align-items: flex-start;
    }

    .info-hint[data-y="bottom"] {
      align-items: flex-end;
    }

    .info-hint[data-x="left"] {
      justify-content: flex-start;
    }

    .info-hint[data-x="right"] {
      justify-content: flex-end;
    }

    .info-hint-layer {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 7px;
      filter: blur(0.2px);
      opacity: 0;
      pointer-events: none;
      white-space: nowrap;
    }

    .info-hint:hover .info-hint-layer {
      opacity: 1;
    }

    .info-hint-text {
      white-space: nowrap;
    }

    .info-hint-icon {
      display: inline-grid;
      place-items: center;
      width: 17px;
      height: 17px;
      border: 1px solid currentColor;
      line-height: 1;
      box-shadow: 2px 2px 0 currentColor;
    }

    .pause-tick {
      --corner-offset: 3px;
      width: 12px;
      height: 12px;
      opacity: 0;
      pointer-events: none;
    }

    .pause-tick::before,
    .pause-tick::after {
      content: "";
      position: absolute;
      top: 0;
      width: 3px;
      height: 10px;
      background: var(--ink);
    }

    .pause-tick::before {
      left: 1px;
    }

    .pause-tick::after {
      right: 1px;
    }

    body.paused .pause-tick {
      opacity: 0.78;
    }

    .quote-nudge {
      animation: quote-nudge 160ms steps(2, end);
    }

    @keyframes modal-static {

      0%,
      87%,
      100% {
        transform: translate(-50%, -50%) rotate(-0.2deg) translate(0, 0);
      }

      88% {
        transform: translate(-50%, -50%) rotate(0.15deg) translate(2px, -1px);
      }

      90% {
        transform: translate(-50%, -50%) rotate(-0.35deg) translate(-1px, 1px);
      }
    }

    @keyframes modal-cursor {

      0%,
      49% {
        opacity: 0.2;
      }

      50%,
      100% {
        opacity: 0.85;
      }
    }

    @keyframes quote-nudge {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-4px);
      }

      75% {
        transform: translateX(4px);
      }
    }

    .info-modal {
      box-sizing: border-box;
      position: fixed;
      z-index: 20;
      top: 50%;
      left: 50%;
      width: min(640px, calc(100vw - 32px));
      max-height: calc(100vh - 32px);
      margin: 0;
      padding: 16px 18px 13px;
      overflow: auto;
      font: 15px var(--mono);
      filter: blur(0.15px);
      transform: translate(-50%, -50%) rotate(-0.2deg);
      border-style: solid dotted solid double;
      box-shadow:
        3px 0 0 var(--ink),
        -2px 5px 0 var(--paper),
        -3px 6px 0 var(--ink);
      animation: modal-static 3.2s steps(1, end) infinite;
    }

    .info-modal::backdrop {
      background: rgba(255, 255, 255, 0.24);
    }

    .info-modal::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(180deg, transparent 0 7px, rgba(0, 0, 0, 0.07) 7px 8px),
        linear-gradient(90deg, transparent 0 18%, rgba(0, 0, 0, 0.06) 18% 19%, transparent 19% 71%, rgba(0, 0, 0, 0.05) 71% 72%, transparent 72%);
      mix-blend-mode: multiply;
    }

    .info-modal-close {
      position: absolute;
      top: 7px;
      right: 8px;
      padding: 0 5px 1px;
      font: 15px var(--mono);
      line-height: 1.2;
      cursor: pointer;
    }

    .info-modal-close:focus-visible,
    .info-modal a:focus-visible {
      outline: 1px dotted var(--ink);
      outline-offset: 2px;
    }

    .info-modal-close:focus-visible {
      box-shadow: 2px 2px 0 var(--ink);
    }

    .info-modal-title {
      margin: 0 26px 14px 0;
      font-size: 18px;
      font-weight: normal;
    }

    .info-modal-title::before {
      content: "// ";
    }

    .info-modal-title::after {
      content: " _";
      animation: modal-cursor 1.1s steps(1, end) infinite;
    }

    .info-modal-row {
      display: grid;
      grid-template-columns: 13ch minmax(0, 1fr);
      gap: 12px;
      margin: 8px 0;
    }

    .info-modal-label {
      opacity: 0.65;
      text-align: right;
    }

    .info-modal-row[hidden] {
      display: none;
    }

    .info-modal-details,
    .info-modal-row dd {
      margin: 0;
      min-width: 0;
    }

    .info-modal a {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
      overflow-wrap: anywhere;
    }

    .info-modal-rights {
      max-height: 8lh;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.35;
      opacity: 0.72;
    }

    .info-modal-translation-meta {
      display: block;
      margin-top: 2px;
      font-size: 12px;
      letter-spacing: 0.04em;
      opacity: 0.55;
    }

    .info-modal-translation-meta:empty {
      display: none;
    }

    .key-map {
      display: grid;
      grid-template-columns: max-content max-content;
      gap: 14px 18px;
      margin-top: 18px;
      padding: 0;
      list-style: none;
    }

    .key-callout {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: 100%;
      transform: translateX(var(--key-slip, 0));
    }

    .key-callout:nth-child(2) {
      --key-slip: 2px;
    }

    .key-callout:nth-child(4) {
      --key-slip: -1px;
    }

    .key-callout:nth-child(5) {
      grid-column: 1 / -1;
      justify-content: center;
      --key-slip: 0;
    }

    .combo-mix {
      display: inline-flex;
      align-items: center;
      gap: 1px;
      margin-left: 4px;
      font-family: var(--mono);
      opacity: 0.5;
    }

    .combo-mix-plus {
      font-size: 10px;
      margin-right: 1px;
    }

    .combo-mix kbd {
      --kbd-min-width: 12px;
      --kbd-padding: 0 3px;
      --kbd-font: 10px var(--mono);
      --kbd-shadow: 1px 1px 0 var(--ink);
    }

    .info-modal kbd {
      flex: 0 0 auto;
      min-width: var(--kbd-min-width, 19px);
      padding: var(--kbd-padding, 3px 6px);
      font: var(--kbd-font, 14px var(--mono));
      text-align: center;
      box-shadow: var(--kbd-shadow, 2px 2px 0 var(--ink));
    }

    .key-combo-poem {
      grid-column: 1 / -1;
      font-family: var(--mono);
      font-size: 0.7em;
      line-height: 1.5;
      text-align: left;
      margin-top: 14px;
      opacity: 0.5;
    }

    .key-arrow {
      display: inline-block;
      flex: 0 0 auto;
      width: 18px;
      border-top: 1px solid var(--ink);
    }

    .info-modal-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      margin-top: 16px;
      font-size: 13px;
      opacity: 0.72;
    }

    .info-modal-footer kbd {
      --kbd-min-width: 18px;
      --kbd-padding: 1px 4px;
      --kbd-font: 12px var(--mono);
      --kbd-shadow: 1px 1px 0 var(--ink);
    }

    @media (prefers-reduced-motion: reduce) {

      .info-modal,
      .info-modal-title::after {
        animation: none;
      }
    }

    @media (max-width: 520px) {
      .key-map {
        grid-template-columns: 1fr;
      }

      .key-callout:nth-child(5) {
        grid-column: auto;
      }
    }

    /* The toast is two nested layers. The outer pill applies a
       backdrop-filter (invert + hue-rotate) so the chip itself paints
       in colors derived from whatever is behind it — a Wikimedia plate,
       the page's white margin, anything. The inner span then keeps the
       mix-blend-mode: difference trick, which now blends against that
       filtered chip rather than against bare white, so the toast stays
       legible even when the photo doesn't fill the viewport. */
    .signal-flash {
      position: fixed;
      z-index: 15;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      padding: 7px 14px 6px;
      background: rgba(0, 0, 0, 0.18);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.32);
      backdrop-filter: invert(1) hue-rotate(180deg) saturate(1.6) contrast(1.7) brightness(0.7);
      -webkit-backdrop-filter: invert(1) hue-rotate(180deg) saturate(1.6) contrast(1.7) brightness(0.7);
      opacity: 0;
      pointer-events: none;
      transition: opacity 360ms ease-out;
    }

    .signal-flash.lit {
      opacity: 1;
      transition: opacity 90ms ease-in;
    }

    .signal-flash-stack {
      position: relative;
      display: inline-block;
    }

    .signal-flash-glyph {
      display: block;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: lowercase;
      white-space: nowrap;
      paint-order: stroke fill;
      -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.9);
      mix-blend-mode: difference;
    }

    .signal-flash-glyph--main {
      position: relative;
      z-index: 1;
      color: #fff;
    }

    .signal-flash-glyph--ghost {
      position: absolute;
      inset: 0;
      color: #00e5ff;
      transform: translate(1.2px, -0.5px);
      pointer-events: none;
    }

    @supports not (backdrop-filter: invert(1)) {
      .signal-flash {
        background: rgba(0, 0, 0, 0.62);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.22);
        backdrop-filter: none;
      }
      .signal-flash-glyph {
        mix-blend-mode: normal;
        -webkit-text-stroke: 0;
      }
    }
  </style>
</head>

    class BackgroundTrail {
      records = []
      index = -1

      get newest() {
        return this.records.length - 1
      }

      get followingLiveEdge() {
        return this.index === this.newest
      }

      hasAny() {
        return this.records.length > 0
      }

      append(record) {
        const shouldFollow = this.followingLiveEdge
        this.records.push(record)
        return shouldFollow ? this.newest : null
      }

      step(delta) {
        const nextIndex = this.index + delta
        return this.records[nextIndex] ? nextIndex : null
      }

      show(index) {
        this.index = index
        return this.records[index]
      }
    }

    const backgroundTrail = new BackgroundTrail()

    const buildScanBands = () => {
      noiseOverlay.querySelectorAll(".scanBand").forEach(band => band.remove())

      const bandCount = randomInteger({ min: 4, max: 7 })
      const directions = ["down", "up", "right", "left", "diagDown", "diagUp"]
      const animationByDirection = {
        down: "sweepDown", up: "sweepUp",
        right: "sweepRight", left: "sweepLeft",
        diagDown: "sweepDiagDown", diagUp: "sweepDiagUp"
      }

      for (let i = 0; i < bandCount; i++) {
        const direction = directions[randomInteger({ min: 0, max: directions.length - 1 })]
        const filterIndex = randomInteger({ min: 0, max: ScanBandFilterCount - 1 })
        const duration = (randomInteger({ min: 110, max: 340 }) / 100).toFixed(2)
        const delay = (randomInteger({ min: 0, max: 250 }) / 100).toFixed(2)
        // Faint ranges — even the densest band stays well under what a flat
        // 0.34×0.80 rectangle would render. Real glitch noise is mostly thin.
        const fillAlpha = (randomInteger({ min: 4, max: 14 }) / 100).toFixed(2)
        const opacity = (randomInteger({ min: 18, max: 42 }) / 100).toFixed(2)
        const isHorizontal = direction === "down" || direction === "up"
        const isVertical = direction === "right" || direction === "left"
        const isDiagonal = direction === "diagDown" || direction === "diagUp"

        // Soft-edged band: gradient across thickness so the band tapers
        // perpendicular to its motion, then a mask along its length so the ends
        // dissolve organically rather than ending in a hard rectangle.
        const peakStop = randomInteger({ min: 35, max: 60 })
        const thicknessAxis = isVertical ? "to right" : "to bottom"
        const lengthAxis = isVertical ? "to bottom" : "to right"
        const fadeIn = randomInteger({ min: 8, max: 28 })
        const fadeOut = 100 - randomInteger({ min: 8, max: 28 })
        const breakChance = Math.random()
        const lengthMask = breakChance < 0.35
          ? `linear-gradient(${lengthAxis}, transparent 0%, black ${fadeIn}%, black ${randomInteger({ min: 35, max: 45 })}%, transparent ${randomInteger({ min: 48, max: 56 })}%, black ${randomInteger({ min: 60, max: 72 })}%, black ${fadeOut}%, transparent 100%)`
          : `linear-gradient(${lengthAxis}, transparent 0%, black ${fadeIn}%, black ${fadeOut}%, transparent 100%)`

        const band = document.createElement("div")
        band.className = "scanBand"
        const css = {
          background: `linear-gradient(${thicknessAxis}, transparent 0%, rgba(0,0,0,${fillAlpha}) ${peakStop}%, transparent 100%)`,
          filter: `url(#bandGlitch${filterIndex}) contrast(1.4)`,
          maskImage: lengthMask,
          webkitMaskImage: lengthMask,
          opacity,
          animation: `${animationByDirection[direction]} ${duration}s linear infinite`,
          animationDelay: `-${delay}s`
        }

        if (isHorizontal) {
          css.left = "0"
          css.right = "0"
          css.top = "0"
          css.height = `${randomInteger({ min: 5, max: 26 })}vh`
        } else if (isVertical) {
          css.top = "0"
          css.bottom = "0"
          css.left = "0"
          css.width = `${randomInteger({ min: 5, max: 26 })}vw`
        } else if (isDiagonal) {
          css.left = "0"
          css.top = "50vh"
          css.width = "140vw"
          css.height = `${randomInteger({ min: 4, max: 18 })}vh`
          css.transformOrigin = "center"
        }

        Object.assign(band.style, css)
        if (isDiagonal) {
          band.style.setProperty("--rot", `${randomInteger({ min: -34, max: 34 })}deg`)
        } else {
          const offsetAxis = isHorizontal ? "--off-x" : "--off-y"
          band.style.setProperty(offsetAxis, `${randomInteger({ min: -8, max: 8 })}vw`)
        }
        noiseOverlay.appendChild(band)
      }

      // Without this watchdog the page just sits on the noise overlay forever.
      // First-load is more impatient (4s match the JSON fetch); steady-state

        if (settled) return
        settled = true
        clearTimeout(stallTimer)
        if (ok) {

          const nextIndex = backgroundTrail.append(record)

      const stallTimer = setTimeout(() => {
        console.warn("Background image stalled, retrying:", record.imageUrl)
        image.src = "" // abort the in-flight request
        settle(false)
      }, stallMs)

      image.onload = () => settle(true)
      image.onerror = error => {
        console.error("Error loading background:", record.imageUrl, error)
        settle(false)
      }

    const tryTranslation = async (languageCode, index, requestId = translationRequestId) => {
      const translations = translationsFor(languageCode)
      if (!translations.length) return false

      const start = modulo(index, translations.length)

      for (let offset = 0; offset < translations.length; offset++) {
        const translationIndex = modulo(start + offset, translations.length)
        const translation = translations[translationIndex]

        try {
          const verse = await getYouVersionVerse(translation, current.passageId)
          if (requestId !== translationRequestId) return true

          current.languageCode = languageCode
          current.translationIndexByLanguage[languageCode] = translationIndex

        }
      }

      return false
    }

    const tryLanguage = async (startIndex, requestId = translationRequestId) => {
      for (let offset = 0; offset < TranslationLanguages.length; offset++) {
        const languageIndex = modulo(startIndex + offset, TranslationLanguages.length)
        const languageCode = TranslationLanguages[languageIndex]
        const translationIndex = current.translationIndexByLanguage[languageCode] || 0

        if (await tryTranslation(languageCode, translationIndex, requestId)) return true
      }

    }

    const changeTranslation = async (action, signal) => {

    const currentTranslationIndex = () =>

    const nextLanguage = () => stepLanguage(1)
    const previousLanguage = () => stepLanguage(-1)

    let signalFlashTimer = 0
    const flashSignal = text => {
      if (!text) return
      signalFlashText.textContent = text
      signalFlashGhost.textContent = text
      signalFlash.classList.add("lit")
      clearTimeout(signalFlashTimer)
      signalFlashTimer = setTimeout(() => signalFlash.classList.remove("lit"), 720)
    }

    const setRandomColors = () => {
      const bgColor = randomHexColor()
      const textColor = calculateContrastColor(bgColor)

      Object.assign(quoteBox.style, { background: bgColor, color: textColor })
    }

    const calculateContrastColor = hexColor => {
      const rgb = parseInt(hexColor.slice(1), 16)
      const r = (rgb >> 16) & 0xff
      const g = (rgb >> 8) & 0xff
      const b = (rgb >> 0) & 0xff
      const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b
      return luma < 128 ? "#fff" : "#000"
    }

    const openInfoModal = () => {
      updateInfoModal()
      setPaused(PauseReason.Modal, true)
      if (!infoModal.open) infoModal.showModal()
      logPopupOpen()
    }

    const logEvent = path => {
      try {
        const payload = JSON.stringify({
          citation: current.citation,
          translation: current.translation?.abbreviation,
          language: current.translation?.languageTag,
          passageId: current.passageId,
          imageTitle: current.background?.imageTitle || current.background?.title,
          pageUrl: current.background?.pageUrl,
          imageUrl: current.background?.imageUrl,
          locale: navigator.language,
          viewportW: innerWidth,
          viewportH: innerHeight,
          dpr: devicePixelRatio
        })
        navigator.sendBeacon(path, new Blob([payload], { type: "application/json" }))
      } catch {}
    }

    const logPopupOpen = () => logEvent("/api/log/popup")
    const logDownload = () => logEvent("/api/log/download")

    const closeInfoModal = () => {
      if (infoModal.open) infoModal.close()
      setPaused(PauseReason.Modal, false)
      if (infoModal.contains(document.activeElement)) document.activeElement.blur()
    }

    const updateInfoModal = () => {
      infoModalCitation.textContent = current.citation || "waiting"
      infoModalTranslationLink.textContent = translationName(current.translation)
      infoModalTranslationMeta.textContent = translationMeta(current.translation)

      const scholarlyHref = current.translation?.reference || current.translation?.publisherUrl
      if (scholarlyHref) {
        infoModalTranslationLink.href = scholarlyHref
      } else {
        infoModalTranslationLink.removeAttribute("href")
      }

      infoModalRights.textContent = current.translation?.copyright || ""
      infoModalRightsRow.hidden = !current.translation?.copyright

      const source = current.background

      if (!source?.pageUrl) {
        infoModalImageLink.removeAttribute("href")
        infoModalImageLink.textContent = "waiting"
        return
      }

      infoModalImageLink.href = source.pageUrl
      infoModalImageLink.textContent = source.imageTitle || source.title || source.pageUrl
    }

    const setPaused = (reason, active) => {
      pauseReasons[active ? "add" : "delete"](reason)
      syncPausedIndicator()
    }

    const syncPausedIndicator = () => document.body.classList.toggle("paused", paused())

    const toggleUserPause = () => setPaused(PauseReason.User, !pauseReasons.has(PauseReason.User))

    const nudgeQuote = () => {
      quoteBox.classList.remove("quote-nudge")
      void quoteBox.offsetWidth
      quoteBox.classList.add("quote-nudge")
    }

    const moveBackground = delta => {
      const index = backgroundTrail.step(delta)
      index === null ? nudgeQuote() : showBackground(index)
    }

    const previousBackground = () => moveBackground(-1)
    const nextBackground = () => moveBackground(1)

    const canvasBackgroundColor = () => {
      const bodyColor = getComputedStyle(document.body).backgroundColor
      return bodyColor === "rgba(0, 0, 0, 0)" ? "white" : bodyColor
    }

    const wrapCanvasText = (context, text, maxWidth) => {
      const wrapped = text.split(/\s+/).reduce(({ lines, line }, word) => {
        const nextLine = line ? `${line} ${word}` : word
        return context.measureText(nextLine).width <= maxWidth || !line
          ? { lines, line: nextLine }
          : { lines: [...lines, line], line: word }
      }, { lines: [], line: "" })

      return wrapped.line ? [...wrapped.lines, wrapped.line] : wrapped.lines
    }

    const cssNumber = (style, property) => parseFloat(style[property]) || 0

    const drawQuoteBox = context => {
      const rect = quoteBox.getBoundingClientRect()
      const style = getComputedStyle(quoteBox)
      const padding = {
        left: cssNumber(style, "paddingLeft"),
        right: cssNumber(style, "paddingRight"),
        top: cssNumber(style, "paddingTop")
      }
      const fontSize = cssNumber(style, "fontSize")
      const lineHeight = parseFloat(style.lineHeight) || fontSize * 1.2
      const textWidth = rect.width - padding.left - padding.right

      context.fillStyle = style.backgroundColor
      context.fillRect(rect.left, rect.top, rect.width, rect.height)
      context.fillStyle = style.color
      context.font = `${style.fontStyle} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`
      context.textBaseline = "top"

      wrapCanvasText(context, current.quote, textWidth).forEach((line, index) => {
        context.fillText(line, rect.left + padding.left, rect.top + padding.top + index * lineHeight)
      })
    }

    const filenameWords = (text, limit = 5) =>
      (text || "")
        .replace(/\.[^.]+$/, "")
        .match(/[\p{L}\p{N}]+/gu)
        ?.slice(0, limit)
        .join("-") || "image"

    const filenamePart = text =>
      filenameWords(text, 12)
        .replace(/[^\p{L}\p{N}-]+/gu, "-")
        .replace(/^-+|-+$/g, "") || "lem-rodeo"

    const downloadFilename = () =>
      `${filenamePart(current.citation)}-${filenamePart(filenameWords(current.background?.imageTitle || current.background?.title))}.png`

    const downloadScale = (width, height) => {
      const preferredScale = Math.min(window.devicePixelRatio || 1, DownloadImage.maxScale)
      const boundedScale = Math.sqrt(DownloadImage.pixelLimit / (width * height))

      return Math.max(1, Math.min(preferredScale, boundedScale))
    }

    const drawCenteredBackground = (context, image, width, height) =>
      context.drawImage(image, (width - image.naturalWidth) / 2, (height - image.naturalHeight) / 2)

    const downloadFailed = error => {
      if (error) console.error("Could not export download image:", error)
      nudgeQuote()
    }

    const downloadBlob = blob => {
      if (!blob) {
        console.error("Could not create download image")
        nudgeQuote()
        return
      }

      const filename = downloadFilename()
      const file = typeof File === "function" ? new File([blob], filename, { type: blob.type || "image/png" }) : blob
      const url = URL.createObjectURL(file)
      const link = document.createElement("a")

      Object.assign(link, { href: url, download: filename })
      link.style.display = "none"
      document.body.append(link)
      link.click()
      logDownload()

      setTimeout(() => {
        link.remove()
        URL.revokeObjectURL(url)
      }, 30000)
    }

    const downloadCurrentView = () => {
      if (!current.background?.image) {
        nudgeQuote()
        return
      }

      const width = window.innerWidth
      const height = window.innerHeight
      const scale = downloadScale(width, height)
      const canvas = document.createElement("canvas")
      const image = current.background.image

      canvas.width = Math.round(width * scale)
      canvas.height = Math.round(height * scale)

      const context = canvas.getContext("2d")
      if (!context) return downloadFailed()

      context.scale(scale, scale)
      context.fillStyle = canvasBackgroundColor()
      context.fillRect(0, 0, width, height)
      drawCenteredBackground(context, image, width, height)
      drawQuoteBox(context)

      try {
        canvas.toBlob(downloadBlob, "image/png")
      } catch (error) {
        downloadFailed(error)
      }
    }

    const editableTarget = target =>
      target.isContentEditable || ["INPUT", "TEXTAREA", "SELECT", "BUTTON", "A"].includes(target.tagName)

    // Bindings keyed by event.code (physical key position) so they survive
    // any keyboard layout — Hebrew, Cyrillic, AZERTY, Dvorak. event.key is
    // only consulted for the ? help intent, which lives on whatever key
    // produces the literal "?" character.
    const StepCodes = {
      Comma: -1, Period: 1
    }

    const BracketCodes = {
      BracketLeft: -1, BracketRight: 1
    }

    const ModifierCodes = {
      KeyT: { id: "t", back: previousTranslation, forward: nextTranslation },
      KeyL: { id: "l", back: previousLanguage, forward: nextLanguage }
    }

    const SimpleCodes = {
      Space: toggleUserPause,
      KeyD: downloadCurrentView
    }

    let heldModifier = null
    let modifierConsumed = false
    let heldBracket = null
    let bracketConsumed = false

    const releaseModifier = () => {
      heldModifier = null
      modifierConsumed = false
      heldBracket = null
      bracketConsumed = false
    }

    const stepBackground = direction =>
      (direction < 0 ? previousBackground : nextBackground)()

    const handleKeydown = event => {
      if (event.key === "Escape" && infoModal.open) {
        event.preventDefault()
        closeInfoModal()
        return
      }

      if (infoModal.open || editableTarget(event.target)) return

      if (event.key === "?") {
        event.preventDefault()
        openInfoModal()
        return
      }

      const modifier = ModifierCodes[event.code]
      if (modifier && !event.repeat) {
        event.preventDefault()
        if (heldBracket !== null) {
          bracketConsumed = true
            ; (heldBracket < 0 ? modifier.back : modifier.forward)()
          return
        }
        if (heldModifier?.id !== modifier.id) {
          heldModifier = modifier
          modifierConsumed = false
        }
        return
      }

      const bracket = BracketCodes[event.code]
      if (bracket) {
        event.preventDefault()
        if (event.repeat) return
        if (heldModifier) {
          modifierConsumed = true
            ; (bracket < 0 ? heldModifier.back : heldModifier.forward)()
          return
        }
        if (heldBracket !== bracket) {
          heldBracket = bracket
          bracketConsumed = false
        }
        return
      }

      const direction = StepCodes[event.code]
      if (direction) {
        event.preventDefault()
        if (event.repeat) return
        if (heldModifier) {
          modifierConsumed = true
            ; (direction < 0 ? heldModifier.back : heldModifier.forward)()
        } else {
          stepBackground(direction)
        }
        return
      }

      const command = SimpleCodes[event.code]
      if (!command) return

      event.preventDefault()
      command()
    }

    const handleKeyup = event => {
      const modifier = ModifierCodes[event.code]
      if (modifier && heldModifier?.id === modifier.id) {
        const used = modifierConsumed
        heldModifier = null
        modifierConsumed = false
        if (!used) modifier.forward()
        return
      }

      const bracket = BracketCodes[event.code]
      if (bracket && heldBracket === bracket) {
        const used = bracketConsumed
        heldBracket = null
        bracketConsumed = false
        if (!used) stepBackground(bracket)
      }
    }

    infoModalClose.addEventListener("click", closeInfoModal)
    infoModalClose.addEventListener("keydown", event => {
      if (event.code === "Space" || event.key === " ") event.preventDefault()
    })
    infoModal.addEventListener("cancel", event => {
      event.preventDefault()
      closeInfoModal()
    })
    document.addEventListener("keydown", handleKeydown)
    document.addEventListener("keyup", handleKeyup)
    window.addEventListener("blur", releaseModifier)

    const everyRodeoCycle = action => {
      setInterval(() => {
        if (!paused()) action()
      }, Interval)
    }

    const startRodeo = () => {
      plantCornerFurniture()
      renderKeyLegend()
      startNoise()
      getVerse()
      queueRandomWikimediaBackground()
      setRandomColors()

      everyRodeoCycle(queueRandomWikimediaBackground)
      everyRodeoCycle(setRandomColors)
    }

    startRodeo()
  </script>
</body>

</html>
